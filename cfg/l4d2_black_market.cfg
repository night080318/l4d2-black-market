// ============================================================
//  Black Market (l4d2_black_market) v1.4.3
//  Supply points economy for L4D2 co-op.
//  Config path: left4dead2/cfg/sourcemod/l4d2_black_market.cfg
//  Apply: sm plugins reload l4d2_black_market
// ============================================================

// 1 = enable whole system, 0 = disable
sm_bm_enabled 1

// point gain multiplier (1.0 = default, 2.0 = double)
sm_bm_points_mult 1.0

// shop price multiplier (1.5 = 50% more expensive)
sm_bm_price_mult 1.0

// 1 = show a chat line to the killer for every special infected kill
sm_bm_killnotify 1

// seconds allowed between special kills to keep a streak going
sm_bm_streak_window 25.0

// points awarded to every survivor when a chapter is completed
sm_bm_chapter_bonus 10

// ---- sounds ----
// 1 = play shop blips (sound pack from the Steam Workshop)
sm_bm_sounds 1

// 0 = client "play" command (default, only method that works)
// 1 = engine EmitSound (fallback)
sm_bm_sound_mode 0

// ---- attributes (!attr) ----
// 1 = enable the attribute system
sm_bm_attrs 1

// 1 = wipe attributes when a campaign is won (or the team wipes)
sm_bm_campaign_reset 1

// 1 = also wipe supply points on campaign end (0 = attributes only)
sm_bm_reset_points 1

// reload attribute: reduction per level (0.20 = -20% per level, -60% at level 3)
sm_bm_attr_reload_step 0.20

// reload attribute: lowest multiplier the reload time can reach
sm_bm_attr_reload_floor 0.30

// 1 = sniper rifles also get a shorter bolt / firing interval
sm_bm_attr_sniper_bolt 1

// 1 = also speed up the bolt animation.
// WARNING: the engine re-sends the whole attack animation, which ejects an
// extra shell casing. Leave at 0 unless you know what you are doing.
sm_bm_attr_sniper_anim 0

// sniper firing interval: lowest multiplier
sm_bm_attr_sniper_floor 0.60

// grenade launcher reload gets this extra multiplier on top of the attribute
sm_bm_attr_gl_mult 0.85

// damage attribute: gun damage bonus per level (0.10 = +10% per level, +30% at 3)
sm_bm_attr_dmg_step 0.10

// melee attribute: melee damage bonus per level (0.18 = +18% per level, +54% at 3)
sm_bm_attr_melee_step 0.18

// speed attribute: movement speed bonus per level (0.10 = +10% per level, +30% at 3)
// NOTE: the multiplier also affects jumping.
sm_bm_attr_speed_step 0.10

// ---- keybind ----
// 1 = auto bind the B key to the shop when a player joins (0 = leave keys alone)
sm_bm_autobind 1

// ---- diagnostics ----
// 1 = print reload / bolt diagnostics to chat and server console
sm_bm_debug 0

// ---- cheats (local testing) ----
// 1 = allow !cheat / !bmadd / !test, 0 = disable
sm_bm_cheat_enabled 1

// how many points !cheat auto-refills back to after every purchase
sm_bm_cheat_amount 9999
