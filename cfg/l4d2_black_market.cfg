// ============================================================
//  Black Market (l4d2_black_market) v1.3.0
//  Supply points economy for L4D2 co-op.
//  Config path: left4dead2/cfg/sourcemod/l4d2_black_market.cfg
//  Apply: sm plugins reload l4d2_black_market
// ============================================================

// 1 = enable whole system, 0 = disable
sm_bm_enabled 1

// 1 = play shop blips (sound pack from the Steam Workshop)
sm_bm_sounds 1

// 1 = enable the attribute system (!attr)
sm_bm_attrs 1

// 1 = wipe attributes when a campaign is won (or the team wipes)
sm_bm_campaign_reset 1

// 1 = also wipe supply points on campaign end (0 = attributes only)
sm_bm_reset_points 1

// 1 = print throwable-boost diagnostics to the server console
sm_bm_debug 0

// point gain multiplier (1.0 = default, 2.0 = double)
sm_bm_points_mult 1.0

// shop price multiplier (1.5 = 50% more expensive)
sm_bm_price_mult 1.0

// 1 = show a chat line to the killer for every special infected kill
sm_bm_killnotify 1

// seconds allowed between special kills to keep a streak going
sm_bm_streak_window 25.0

// points awarded to every survivor when a chapter is completed
sm_bm_chapter_bonus 10

// ---- cheats (local testing) ----
// 1 = allow !cheat / !bmadd, 0 = disable
sm_bm_cheat_enabled 1

// how many points !cheat auto-refills back to after every purchase
sm_bm_cheat_amount 9999
